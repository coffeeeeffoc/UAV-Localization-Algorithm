[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-localization-research"
version = "0.1.0"
description = "Reproducible UWB/IMU localization and authenticated telemetry research baseline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "cryptography>=42,<51",
]

[tool.setuptools.packages.find]
where = ["src"]
